name: Paper Clock Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/paperclock/**"
      - ".github/workflows/android-paperclock.yml"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/paperclock/**"
      - ".github/workflows/android-paperclock.yml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    permissions:
      contents: write
    uses: ./.github/workflows/android-apk.yml
    with:
      app: paperclock
      display-name: Paper Clock
      asset-name: PaperClock
      tag-prefix: paperclock-v
      java-version: "21"
      android-platform: "36"
      build-tools: 36.0.0
