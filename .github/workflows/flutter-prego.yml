name: Prego Flutter

on:
  push:
    branches: [main]
    paths:
      - "flutter/prego/**"
      - ".github/workflows/flutter-prego.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter/prego/**"
      - ".github/workflows/flutter-prego.yml"
  workflow_dispatch:

concurrency:
  group: prego-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a release while publishing its assets.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.version.outputs.flutter }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned SDK and app version
        id: version
        working-directory: flutter/prego
        shell: bash
        run: |
          SDK="$(tr -d '\r\n' < .flutter-version)"
          [[ "$SDK" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]
          # Start above the historical build number without committing CI version bumps.
          BUILD=$((BASH_REMATCH[2] + GITHUB_RUN_NUMBER))
          {
            echo "flutter=$SDK"
            echo "version=${BASH_REMATCH[1]}"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check and build ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    defaults:
      run:
        working-directory: flutter/prego
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"

      - name: Set up Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.metadata.outputs.flutter }}
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Android debug APK
        if: matrix.platform == 'android'
        run: flutter build apk --debug --no-pub

      - name: Build unsigned Android release APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --no-pub --build-number "${{ needs.metadata.outputs.build }}"

      - name: Upload debug APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: prego-debug-apk
          path: flutter/prego/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK for signing
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: prego-unsigned-apk
          path: flutter/prego/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build iOS (compile check only, no signing or distribution)
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign --no-pub --build-number "${{ needs.metadata.outputs.build }}"

  release:
    name: Sign and publish Android release
    needs: [metadata, check]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download tested release APK
        uses: actions/download-artifact@v4
        with:
          name: prego-unsigned-apk
          path: release/unsigned

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
          log-accepted-android-sdk-licenses: "false"

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              exit 1
            fi
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/prego-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          ASSET="Prego-v$VERSION-build.$GITHUB_RUN_NUMBER.apk"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "release/$ASSET" release/unsigned/app-release.apk
          "$SIGNER" verify --verbose "release/$ASSET"
          (cd release && sha256sum "$ASSET" > "$ASSET.sha256")

      - name: Publish app-specific GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prego-v${{ needs.metadata.outputs.version }}-build.${{ github.run_number }}
          name: Prego v${{ needs.metadata.outputs.version }} · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Do not displace another monorepo app's latest release.
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/*.sha256
