name: Android APK (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: Gradle project directory under android/
        required: true
        type: string
      display-name:
        description: Human-readable app name used in the release title
        required: true
        type: string
      asset-name:
        description: Release asset file name prefix, e.g. PaperClock
        required: true
        type: string
      tag-prefix:
        description: Release tag prefix, e.g. paperclock-v
        required: true
        type: string
      java-version:
        required: true
        type: string
      android-platform:
        description: Android SDK platform level to install
        required: true
        type: string
      build-tools:
        required: true
        type: string
      checks:
        description: Extra Gradle tasks to run before assembling, e.g. testDebugUnitTest lintDebug
        required: false
        type: string
        default: ""
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Check and build APKs
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    defaults:
      run:
        working-directory: android/${{ inputs.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android platform ${{ inputs.android-platform }}
        run: sdkmanager --install "platforms;android-${{ inputs.android-platform }}" "build-tools;${{ inputs.build-tools }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          VERSION_NAME="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Run checks
        if: inputs.checks != ''
        run: ./gradlew ${{ inputs.checks }} --no-daemon

      - name: Assemble debug and unsigned release APKs
        # Reserve a range above historical version codes. Never reset this workflow's run counter.
        run: ./gradlew assembleDebug assembleRelease -PreleaseVersionCode="$((1000 + GITHUB_RUN_NUMBER))" --no-daemon

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-debug-apk
          path: android/${{ inputs.app }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK for signing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-unsigned-apk
          path: android/${{ inputs.app }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested release APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-unsigned-apk
          path: release/unsigned

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;${{ inputs.build-tools }}
          log-accepted-android-sdk-licenses: "false"

      - name: Sign and verify release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ASSET: ${{ inputs.asset-name }}-v${{ needs.build.outputs.version_name }}-build.${{ github.run_number }}.apk
          BUILD_TOOLS: ${{ inputs.build-tools }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              exit 1
            fi
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/android-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          SIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "release/$ASSET" release/unsigned/app-release-unsigned.apk
          "$SIGNER" verify --verbose "release/$ASSET"
          (cd release && sha256sum "$ASSET" > "$ASSET.sha256")

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-prefix }}${{ needs.build.outputs.version_name }}-build.${{ github.run_number }}
          name: ${{ inputs.display-name }} v${{ needs.build.outputs.version_name }} · build ${{ github.run_number }} (signed)
          generate_release_notes: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/*.apk
            release/*.sha256
