name: Fuego macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version (for example 1.2.3); overrides the bump choice
        required: false
        type: string
      bump:
        description: Version component to increment when no exact version is provided
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: macos-fuego-release
  cancel-in-progress: false

permissions:
  contents: write

# Releases are tagged fuego-v<version>. downloads.jonaylor.com/fuego.dmg and
# /fuego/appcast.xml (apps/redirects) point at the newest one.

defaults:
  run:
    working-directory: macos/fuego

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST_TAG="$(gh release list --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName \
            --jq '[.[].tagName | select(startswith("fuego-v"))][0] // ""')"
          # 1.0.0 was the last release from the standalone jonaylor89/Fuego repo.
          CURRENT="${LATEST_TAG#fuego-v}"
          CURRENT="${CURRENT:-1.0.0}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ ! "$CURRENT" =~ $SEMVER_RE ]]; then
            echo "Latest release tag is not a supported semantic version: $LATEST_TAG" >&2
            exit 2
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="${REQUESTED_VERSION#v}"
            if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
              echo "Exact version must use X.Y.Z format; got $REQUESTED_VERSION" >&2
              exit 2
            fi
            IFS=. read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT"
            IFS=. read -r NEXT_MAJOR NEXT_MINOR NEXT_PATCH <<< "$VERSION"
            if (( NEXT_MAJOR < CURRENT_MAJOR ||
                  (NEXT_MAJOR == CURRENT_MAJOR && NEXT_MINOR < CURRENT_MINOR) ||
                  (NEXT_MAJOR == CURRENT_MAJOR && NEXT_MINOR == CURRENT_MINOR && NEXT_PATCH <= CURRENT_PATCH) )); then
              echo "Exact version $VERSION must be newer than the latest release $CURRENT" >&2
              exit 2
            fi
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *) echo "Unsupported version bump: $BUMP" >&2; exit 2 ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          if gh release view "fuego-v$VERSION" >/dev/null 2>&1; then
            echo "Release fuego-v$VERSION already exists." >&2
            exit 2
          fi

          # Sparkle and macOS (for the content filter) both need the build number to increase.
          # Builds from the standalone repo went up to 102; this workflow's run numbers restart at 1.
          BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "previous_tag=$LATEST_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Fuego $VERSION ($BUILD_NUMBER) from $GITHUB_SHA"

      - name: Validate release secrets
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD API_KEY API_KEY_ID API_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name" >&2; exit 2; }
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unit tests
        run: |
          xcodebuild -project Fuego.xcodeproj -scheme Fuego -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -only-testing:FuegoTests CODE_SIGNING_ALLOWED=NO test

      - name: Draft release notes
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          # Generated notes would list every change in the monorepo, so only list Fuego's.
          {
            echo "## What's changed"
            echo
            git log "${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD" --no-merges --format="- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H))" -- . ../../.github/workflows/macos-fuego*.yml
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Install signing credentials
        id: credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          # API keys can't use the team's cloud-managed Developer ID certificate, so
          # sign with an exported one; the API key fetches provisioning profiles.
          KEYCHAIN="$RUNNER_TEMP/fuego-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || {
            echo "The certificate secret doesn't contain a Developer ID Application identity" >&2; exit 2;
          }
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$API_KEY" | base64 --decode > "$API_KEY_PATH"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | base64 --decode > "$SPARKLE_KEY_PATH"
          chmod 600 "$API_KEY_PATH" "$SPARKLE_KEY_PATH"
          {
            echo "api_key_path=$API_KEY_PATH"
            echo "sparkle_key_path=$SPARKLE_KEY_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, and package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          ASC_KEY_PATH: ${{ steps.credentials.outputs.api_key_path }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_KEY_FILE: ${{ steps.credentials.outputs.sparkle_key_path }}
        run: scripts/release.sh

      - name: Remove signing credentials
        if: always()
        env:
          KEYCHAIN: ${{ steps.credentials.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/sparkle-private-key" "$RUNNER_TEMP/developer-id.p12"
          [[ -n "$KEYCHAIN" ]] && security delete-keychain "$KEYCHAIN" || true

      - name: Retain crash symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuego-symbols-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: macos/fuego/build/release/*-dSYMs.zip
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="fuego-v$VERSION"
          cd build/release
          (shasum -a 256 -c SHA256SUMS.txt)
          # Upload everything to a draft first, then publish, so the appcast that
          # downloads.jonaylor.com serves never points at a missing DMG.
          gh release create "$TAG" \
            "Fuego-$VERSION.dmg" Fuego.dmg appcast.xml SHA256SUMS.txt "Fuego-$VERSION-dSYMs.zip" \
            --target "$GITHUB_SHA" \
            --title "Fuego $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$TAG" --draft=false

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN isn't set; update Casks/fuego.rb in jonaylor89/homebrew-tap by hand (sha256 $SHA256)."
            exit 0
          fi
          TAP="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/jonaylor89/homebrew-tap.git" "$TAP"
          mkdir -p "$TAP/Casks"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
              Casks/fuego.rb > "$TAP/Casks/fuego.rb"
          cd "$TAP"
          git config user.name "fuego-release[bot]"
          git config user.email "fuego-release[bot]@users.noreply.github.com"
          git add Casks/fuego.rb
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "fuego $VERSION"
          git push origin HEAD
