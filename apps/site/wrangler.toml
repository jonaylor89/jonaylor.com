name = "site"
compatibility_date = "2025-03-15"
workers_dev = true
preview_urls = true

main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "jonaylor.com"
