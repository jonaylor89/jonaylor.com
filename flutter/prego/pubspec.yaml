name: prego
description: A novelty pregnancy-test simulator. Results are random, not medical advice.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/AtkinsonHyperlegible-OFL.txt
    - assets/fonts/AtkinsonHyperlegibleMono-OFL.txt
    - assets/fonts/Shrikhand-OFL.txt
  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Variable.ttf
    - family: Shrikhand
      fonts:
        - asset: assets/fonts/Shrikhand-Regular.ttf
