application:
  port: 8000

database:
  path: "./data/weiterleitung.db"

admin:
  username: "admin"

# api:
#   key: "long-random-token"   # enables Bearer auth on /api/*

aliases:
  domains:
    - "example.com"
  reverse_alias_prefix: "ct"

inbound:
  host: "0.0.0.0"
  port: 2525
  hostname: "mail.example.com"
  max_message_size: 26214400

delivery:
  mode: "relay"
  mail_dir: "./data/mail"
  poll_interval_secs: 10
  max_attempts: 8
  ehlo_hostname: "mail.example.com"

dkim:
  enabled: false
  domain: "example.com"
  selector: "weiterleitung"
