name: services

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  hub:
    <<: *service
    image: jonaylor/hub@sha256:7dbae9776a674641b0366f53b7ddf44775c88d9dd798eb8008798fb99bf46039
    init: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: production
      APP_APPLICATION__BASE_URL: ${HUB_BASE_URL:?Set HUB_BASE_URL}
      APP_APPLICATION__HMAC_SECRET: ${HUB_HMAC_SECRET:?Set HUB_HMAC_SECRET}
      APP_REDIS_URI: redis://redis:6379
      APP_EMAIL_CLIENT__BASE_URL: https://api.postmarkapp.com
      APP_EMAIL_CLIENT__SENDER_EMAIL: ${EMAIL_SENDER:?Set EMAIL_SENDER}
      APP_EMAIL_CLIENT__AUTHORIZATION_TOKEN: ${POSTMARK_TOKEN:?Set POSTMARK_TOKEN}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - type: bind
        source: ../../services/hub/configuration/base.yaml
        target: /app/configuration/base.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./hub.yaml
        target: /app/configuration/production.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_DIR:?Set APPDATA_DIR}/hub
        target: /app/data
        bind:
          create_host_path: false

  redis:
    <<: *service
    image: redis@sha256:387977b505c656572e08163141edbfe89e6d2434316569a2bbeaae5cfeba388f
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - type: bind
        source: ${APPDATA_DIR}/redis
        target: /data
        bind:
          create_host_path: false

  gitea:
    <<: *service
    image: gitea/gitea@sha256:17d18218be2dad1f8ed402a4f906989505c90ab8b66ee9befcecfb5d470133e7
    environment:
      USER_UID: ${PUID:?Set PUID}
      USER_GID: ${PGID:?Set PGID}
      TZ: ${TZ:-Etc/UTC}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:?Set GITEA_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:?Set GITEA_ROOT_URL}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
      - "${BIND_ADDRESS:-127.0.0.1}:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - type: bind
        source: ${APPDATA_DIR}/gitea
        target: /data
        bind:
          create_host_path: false

  uptime:
    <<: *service
    image: louislam/uptime-kuma@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3001"
    volumes:
      - type: bind
        source: ${APPDATA_DIR}/uptime
        target: /app/data
        bind:
          create_host_path: false

  cloudflared:
    <<: *service
    image: cloudflare/cloudflared@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
